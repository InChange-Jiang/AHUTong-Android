name: Android CI

on:
  push:
    branches:
      - master
      - main
      - "p/**"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "master"
        type: string

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --install "platforms;android-36" "build-tools;37.0.0" "ndk;28.2.13676358"

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android
          components: clippy

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set Gradle permission
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            sdk
            GuiXu-Rust

      - name: Test Rust SDK
        run: |
          cargo test --manifest-path sdk/Cargo.toml
          # The pinned SDK still contains a known unsupported look-ahead regex.
          # Keep every other Clippy check active until that SDK fix is merged.
          cargo clippy --manifest-path sdk/Cargo.toml --all-targets -- --allow clippy::invalid_regex

      - name: Test, lint and build debug Android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleDebug --stacktrace

      - name: Build release Android
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AHUTong-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
